name: Offline upload staging observer
on:
  pull_request:
    paths:
      - 'scripts/upload-staging-observer*.mjs'
      - '.github/workflows/upload-staging-observer.yml'
permissions:
  contents: read
jobs:
  observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/upload-staging-observer.mjs
      - run: node --test scripts/upload-staging-observer.test.mjs
