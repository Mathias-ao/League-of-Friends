name: Fast Candidate Hotspots

on:
  pull_request:
    paths:
      - ".github/workflows/fast-candidate-hotspots.yml"
      - "replay-tools/benchmark_upload_critical_path.py"
      - "replay-tools/recorded_events_stream.py"
      - "replay-tools/statistics_projector.py"
      - "replay-tools/statistics_direct_shared.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: "Candidate-only ${{ matrix.fixture }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        fixture: [1v1_t90-resi, 2v2_chaos, 4v4_arabia, FFA_7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 2d04ec6adbe871d156c108a4351448efeb08f4e6
          path: .fixture-corpus
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r replay-tools/requirements.txt
      - name: Verify current build control
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          name=os.environ["FIXTURE"]
          root=Path(".fixture-corpus/replay-fixtures/build-185872")
          assert (root/(name+".aoe2record")).is_file()
          with (root/"townbell_build-185872"/(name+".json")).open() as f:
              assert json.load(f)["meta"]["game_build"]==185872
          PY
      - name: Run verified direct evidence and full inferred-statistics projection
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          mkdir -p ".replay-lab/fast-candidate-$FIXTURE"
          /usr/bin/time -v -o ".replay-lab/fast-candidate-$FIXTURE/resources.txt" \
            python replay-tools/benchmark_upload_critical_path.py \
            --mode direct-events-candidate \
            --replay ".fixture-corpus/replay-fixtures/build-185872/$FIXTURE.aoe2record" \
            --out ".replay-lab/fast-candidate-$FIXTURE/report.json"
      - name: Summarize performance target (not a release gate)
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(".replay-lab/fast-candidate-"+os.environ["FIXTURE"])
          r=json.loads((d/"report.json").read_text())
          print("candidate_local_seconds",round(r["totalMs"]/1000,2))
          print("under20s_local",r["totalMs"]<20000)
          print("under30s_local",r["totalMs"]<30000)
          print("WARNING: remote upload-to-READY is unmeasured")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-hotspots-${{ matrix.fixture }}
          path: |
            .replay-lab/fast-candidate-${{ matrix.fixture }}/report.json
            .replay-lab/fast-candidate-${{ matrix.fixture }}/resources.txt
          if-no-files-found: warn
          retention-days: 14
