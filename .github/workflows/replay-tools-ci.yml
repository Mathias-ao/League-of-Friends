name: Replay Tools CI

on:
  push:
    paths:
      - "replay-tools/**"
      - "scripts/ingest-replay-file.mjs"
      - "scripts/lib/canonical-artifacts.mjs"
      - "scripts/test-canonical-artifacts.mjs"
      - "scripts/test-replay-corpus.mjs"
      - "scripts/test-match-analysis-corpus.mjs"
      - "scripts/summarize-replay-output.mjs"
      - "scripts/smoke-test-replay-analysis.mjs"
      - "scripts/set-emulator-replay-analysis-profile.mjs"
      - ".github/workflows/replay-tools-ci.yml"
  pull_request:
    paths:
      - "replay-tools/**"
      - "scripts/ingest-replay-file.mjs"
      - "scripts/lib/canonical-artifacts.mjs"
      - "scripts/test-canonical-artifacts.mjs"
      - "scripts/test-replay-corpus.mjs"
      - "scripts/test-match-analysis-corpus.mjs"
      - "scripts/summarize-replay-output.mjs"
      - "scripts/smoke-test-replay-analysis.mjs"
      - "scripts/set-emulator-replay-analysis-profile.mjs"
      - ".github/workflows/replay-tools-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install replay parser dependency
        run: pip install -r replay-tools/requirements.txt

      - name: Validate Python adapter
        run: |
          python -m py_compile replay-tools/*.py
          python replay-tools/parse_replay.py --help
          python -m unittest discover -s replay-tools/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Node replay tools
        run: |
          node --check scripts/ingest-replay-file.mjs
          node --check scripts/summarize-replay-output.mjs
          node --check scripts/smoke-test-replay-analysis.mjs
          node --check scripts/set-emulator-replay-analysis-profile.mjs
          node --check scripts/test-replay-corpus.mjs
          node --check scripts/test-match-analysis-corpus.mjs
          node --test scripts/test-canonical-artifacts.mjs
