name: Staging E2E callable HTTP and Auth smoke

on:
  pull_request:
    paths:
      - "functions/**"
      - "scripts/verify-staging-web-env.mjs"
      - "web/.env.staging.example"
      - ".github/workflows/staging-e2e-auth-http-emulator.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/staging-e2e-auth-http-emulator.yml"

permissions:
  contents: read

jobs:
  authenticated-callable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      FIREBASE_CLI_DISABLE_USAGE_REPORTING: "true"
      # Explicitly mark this standalone client runner as a local test process.
      FUNCTIONS_EMULATOR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify staging website project and opt-in refusal without deployment
        run: |
          node --check scripts/verify-staging-web-env.mjs
          node scripts/verify-staging-web-env.mjs --self-test
      - name: Install and build Functions
        run: |
          npm ci --prefix functions --no-audit --no-fund
          npm run build --prefix functions
          node --check functions/tests/staging-e2e-auth-http-emulator.mjs
      - name: Verify Auth emulator credentials through actual local callable HTTP
        run: >
          npx --yes firebase-tools@14 emulators:exec
          --project demo-aof-e2e
          --only auth,firestore,storage,functions
          "node functions/tests/staging-e2e-auth-http-emulator.mjs"
      - name: Retain isolated emulator diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-auth-http-smoke-diagnostics
          path: |
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: ignore
