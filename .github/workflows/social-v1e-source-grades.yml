name: SOC-V1E Genuine Bounded Source Grade Methods

on:
  pull_request:
    paths:
      - "replay-tools/social_v1_source_grades.py"
      - "replay-tools/tests/test_social_v1_source_grades.py"
      - "contracts/social-v1/source-grade-methods-v1.json"
      - "docs/architecture/social-v1e-source-admission-167.md"
      - ".github/workflows/social-v1e-source-grades.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: replay-tools/requirements.txt
      - name: Install existing replay dependencies
        run: python -m pip install -r replay-tools/requirements.txt
      - name: Authenticate original fixture hashes and verify source-admitted positives plus adjacent negatives
        env:
          AOF_SOC_V1E_AUTHENTIC: "1"
        run: python -m unittest discover -s replay-tools/tests -p test_social_v1_source_grades.py -v
