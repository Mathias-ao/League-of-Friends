name: T90 genuine Personality and Reputation private source cohort

on:
  pull_request:
    paths:
      - "functions/src/engines/personalityV1/personalityV1.ts"
      - "functions/src/engines/personalityV1/privateE2EPolicy.ts"
      - "functions/src/engines/personalityV1/contextAdmission.ts"
      - "functions/src/integration/personalityHistory.ts"
      - "functions/tests/personalityV1.test.mjs"
      - "functions/tests/personality-private-e2e.test.mjs"
      - "functions/tests/t90-original-cohort.test.mjs"
      - "replay-tools/t90_original_cohort.py"
      - ".github/workflows/t90-personality-reputation-cohort.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-t90-private-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: replay-tools/requirements.txt
      - name: Install existing statistics and Functions dependencies
        run: |
          python -m pip install -r replay-tools/requirements.txt
          npm --prefix functions ci
          npm --prefix functions run build
      - name: Check original three T90 recordings and source-qualified social methods
        run: python replay-tools/t90_original_cohort.py "${RUNNER_TEMP}/t90-source.json"
      - name: Exercise actual five-axis engine and proposed, non-publishing Reputation history
        env:
          AOF_T90_SOURCE_REPORT: ${{ runner.temp }}/t90-source.json
        run: |
          node --test functions/tests/personalityV1.test.mjs
          node --test functions/tests/personality-private-e2e.test.mjs
          node --test functions/tests/t90-original-cohort.test.mjs
