name: Staging native worker image safety

on:
  pull_request:
    paths:
      - "replay-tools/**"
      - ".github/workflows/staging-native-worker-image.yml"
  push:
    branches: [main]
    paths:
      - "replay-tools/**"
      - ".github/workflows/staging-native-worker-image.yml"

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned worker dependencies and verify hosted authorization
        run: |
          python -m pip install -r replay-tools/requirements.txt
          python -m unittest discover -s replay-tools/tests -p 'test_hosted_worker_auth.py' -v
      - name: Build base and proposed Linux images (NEVER deploy or push)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git show "$BASE_SHA:replay-tools/Dockerfile.staging" > "$RUNNER_TEMP/Dockerfile.worker-base"
          docker build -f "$RUNNER_TEMP/Dockerfile.worker-base" -t aof-worker-base:ci replay-tools
          docker build -f replay-tools/Dockerfile.staging -t aof-staging-native-worker:ci replay-tools
          expected="$(docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            aof-worker-base:ci python -c 'from native_worker_transport import native_processor_revision; print(native_processor_revision())')"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          echo "AOF_EXPECTED_PROCESSOR_REVISION=$expected" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, subprocess
          names = ['aof-worker-base:ci', 'aof-staging-native-worker:ci']
          images = json.loads(subprocess.check_output(['docker', 'image', 'inspect', *names]))
          summary = {}
          for name, image in zip(names, images):
              assert image['Os'] == 'linux' and image['Architecture'] == 'amd64'
              assert image['Config']['User'] == '10001:10001'
              summary[name] = {key: image[key] for key in ('Id', 'Os', 'Architecture')}
              summary[name]['user'] = image['Config']['User']
          print(json.dumps(summary, indent=2))
          PY
      - name: Verify actual image layout, unchanged fingerprint and replay integrity
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            -e AOF_TEST_BUILT_WORKER_IMAGE=1 -e AOF_EXPECTED_PROCESSOR_REVISION \
            aof-staging-native-worker:ci python -c \
            'import sys, unittest; sys.path.insert(0, "tests"); suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(n) for n in ("test_worker_image_layout", "test_native_ingestion", "test_conformance")); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not result.wasSuccessful())'
      - name: Fetch only the owner-authorized exact original regression recording
        uses: actions/checkout@v4
        with:
          ref: d15efaf41d0ce6a587f283061da38c9d8bd8b4a0
          path: .worker-regression-fixture
          persist-credentials: false
      - name: Reprocess exact T90 original through authenticated native and full legacy HTTP paths
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.worker-regression-fixture/T90Official_CC.aoe2record,dst=/recording/T90Official_CC.aoe2record,readonly" \
            aof-staging-native-worker:ci python tests/verify_worker_image_recording.py \
            /recording/T90Official_CC.aoe2record > "$RUNNER_TEMP/worker-image-t90.json"
          cat "$RUNNER_TEMP/worker-image-t90.json"
      - name: Retain only small image verification summaries
        uses: actions/upload-artifact@v4
        with:
          name: worker-image-t90-verification
          path: ${{ runner.temp }}/worker-image-t90.json
          retention-days: 14
          if-no-files-found: error
      - name: Verify pinned native processor revision inside the minimal image
        run: |
          revision="$(docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev \
            --entrypoint python aof-staging-native-worker:ci \
            -c 'from native_worker_transport import native_processor_revision; print(native_processor_revision())')"
          [[ "$revision" =~ ^[a-f0-9]{64}$ ]] || {
            echo "FAIL: native worker revision unavailable inside the image" >&2
            exit 1
          }
          echo "PASS: minimal worker image contains the pinned native processor inputs"
      - name: Verify isolated hosted-mode container refuses missing secrets
        run: |
          docker run -d --name aof-staging-worker-ci --read-only --tmpfs /tmp:rw,nosuid,nodev \
            -p 127.0.0.1:18767:8080 \
            -e K_SERVICE=aof-worker-test \
            -e AOF_EXPERIMENTAL_NATIVE_REPLAY_ENDPOINT=1 \
            aof-staging-native-worker:ci
          for attempt in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:18767/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sSf http://127.0.0.1:18767/health >/dev/null
          for route in process process-native-v1; do
            http="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'content-type: application/json' -d '{}' \
              http://127.0.0.1:18767/$route)"
            test "$http" = 503 || { echo "FAIL: hosted worker without secret returned $http" >&2; exit 1; }
          done
          echo "PASS: nonroot worker container keeps both POST routes closed without secret"
      - name: Cleanup ephemeral test container
        if: always()
        run: docker rm -f aof-staging-worker-ci || true
