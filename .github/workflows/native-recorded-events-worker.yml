name: Native Recorded Events Worker Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/native-recorded-events-worker.yml"
      - "replay-tools/native_ingestion.py"
      - "replay-tools/native_worker_transport.py"
      - "replay-tools/verify_native_package.py"
      - "replay-tools/upload_worker.py"
      - "replay-tools/recorded_events_stream.py"
      - "replay-tools/statistics_projector.py"
      - "replay-tools/statistics_direct_shared.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        fixture: [1v1_t90-deak, 2v2_arabia, 2v2_chaos, 4v4_arabia, FFA_7]
    name: "Native worker ${{ matrix.fixture }}"
    steps:
      - uses: actions/checkout@v4
      - name: Pin real build-185872 replay corpus
        uses: actions/checkout@v4
        with:
          ref: 2d04ec6adbe871d156c108a4351448efeb08f4e6
          path: .fixture-corpus
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r replay-tools/requirements.txt
      - name: Verify paired independent TownBell build identity
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          root=Path(".fixture-corpus/replay-fixtures/build-185872")
          name=os.environ["FIXTURE"]
          assert (root/(name+".aoe2record")).is_file()
          with (root/"townbell_build-185872"/(name+".json")).open(encoding="utf-8") as f:
              report=json.load(f)
          assert report["meta"]["game_build"]==185872
          assert report["meta"]["save_version"]==68.9
          PY
      - name: Package verified native events and shared statistics without canonical seal
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          mkdir -p ".replay-lab/native-worker-$FIXTURE"
          /usr/bin/time -v -o ".replay-lab/native-worker-$FIXTURE/resources.txt" \
            python replay-tools/native_ingestion.py \
              --replay ".fixture-corpus/replay-fixtures/build-185872/$FIXTURE.aoe2record" \
              --out ".replay-lab/native-worker-$FIXTURE/package" \
              --report ".replay-lab/native-worker-$FIXTURE/timings.json"
      - name: Verify complete statistical and social identity from source
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python replay-tools/verify_native_package.py \
            --source ".fixture-corpus/replay-fixtures/build-185872/$FIXTURE.aoe2record" \
            --package ".replay-lab/native-worker-$FIXTURE/package" \
            --report ".replay-lab/native-worker-$FIXTURE/acceptance.json"
      - name: Upload small reports only, never recording or statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-worker-${{ matrix.fixture }}
          path: |
            .replay-lab/native-worker-${{ matrix.fixture }}/timings.json
            .replay-lab/native-worker-${{ matrix.fixture }}/acceptance.json
            .replay-lab/native-worker-${{ matrix.fixture }}/resources.txt
          if-no-files-found: warn
          retention-days: 14
