name: Sol 1B exact-head V1 private acceptance
on:
  pull_request:
    paths: ['functions/**','web/**','contracts/social-v1/**','replay-tools/**','scripts/sol1b-acceptance-manifest.mjs','docs/testing/sol1b-v1-acceptance-218.md','.github/workflows/sol1b-v1-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-system-private-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_USAGE_REPORTING: 'true'
      FUNCTIONS_EMULATOR: 'true'
      GCLOUD_PROJECT: demo-aof-native-player
      REPLAY_BUCKET: demo-aof-native-player.appspot.com
      REPLAY_WORKER_URL: http://127.0.0.1:18765
      REPLAY_WORKER_AUTH_TOKEN: ephemeral-aof-v1-combined
      AOF_REPLAY_WORKER_AUTH_TOKEN: ephemeral-aof-v1-combined
      AOF_REPLAY_WORKER_BIND: 127.0.0.1
      AOF_REPLAY_WORKER_PORT: '18765'
      AOF_EXPERIMENTAL_NATIVE_REPLAY_ENDPOINT: '1'
      AOF_SOCIAL_E2E_ENDPOINT: '1'
      AOF_INT_C1_ENDPOINT: '1'
      AOF_INT_C2A_ENDPOINT: '1'
      AOF_INT_C2A_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 2d04ec6adbe871d156c108a4351448efeb08f4e6
          path: .fixture-corpus
          persist-credentials: false
      # Policy simulations stay in their own pinned checkout. No draft test
      # thresholds or sandbox evaluator is imported by the integrated runtime.
      - uses: actions/checkout@v4
        with:
          ref: 61f545d901b2f35e92bd133e614519a20eeb4235
          path: .honours-sandbox
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sole source engine and both private interfaces
        run: |
          pip install -r replay-tools/requirements.txt
          npm ci --prefix functions
          npm ci --prefix web
          npm run build --prefix functions
          npm run build --prefix web
      - name: Controlled ten-honour policy and trophy succession simulations
        run: node --test .honours-sandbox/functions/tests/honours-v1-*.test.mjs
      - name: Integrated backend and component regression suites
        run: |
          npm test --prefix functions
          npm test --prefix web
          node scripts/test-player-site-boundaries.mjs
      - name: Five authentic originals across four formats
        run: |
          mkdir -p "$RUNNER_TEMP/aof-v1-corpus"
          for fixture in 1v1_t90-deak 1v1_t90-dobb 2v2_arabia 4v4_arabia FFA_7; do
            cp ".fixture-corpus/replay-fixtures/build-185872/$fixture.aoe2record" "$RUNNER_TEMP/aof-v1-corpus/"
            cp ".fixture-corpus/replay-fixtures/build-185872/townbell_build-185872/$fixture.json" "$RUNNER_TEMP/aof-v1-corpus/"
          done
          echo "AOF_NATIVE_CORPUS=$RUNNER_TEMP/aof-v1-corpus" >> "$GITHUB_ENV"
          echo "AOF_NATIVE_REPLAY_PROCESSOR_REVISION=$(PYTHONPATH=replay-tools python -c 'from native_worker_transport import native_processor_revision; print(native_processor_revision())')" >> "$GITHUB_ENV"
      - name: Record actual tested source, processor and original recording hashes
        env:
          AOF_ACCEPTANCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/sol1b-acceptance-manifest.mjs
      - name: Isolated current-source multiuser progression and ordinary upload parity
        run: |
          python replay-tools/upload_worker.py > "$RUNNER_TEMP/aof-v1-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          npx --yes firebase-tools@14.27.0 emulators:exec --project demo-aof-native-player --only firestore,storage "node functions/tests/int-c2b-progression-emulator.mjs"
      - name: Isolated genuine two-Game Chronicle interaction and same-owner four-system read
        run: |
          python replay-tools/upload_worker.py > "$RUNNER_TEMP/aof-v1-chronicle-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          npx --yes firebase-tools@14.27.0 emulators:exec --project demo-aof-native-player --only firestore,storage "AOF_V1_COMBINED_PRIVATE_READ=1 node functions/tests/chronicle-v1e-auth-emulator.mjs"
      - name: Native statistics unchanged for every authentic replay
        run: |
          for fixture in 1v1_t90-deak 1v1_t90-dobb 2v2_arabia 4v4_arabia FFA_7; do
            python replay-tools/verify_native_package.py --source "$AOF_NATIVE_CORPUS/$fixture.aoe2record" --package ".replay-lab/native-player/$fixture" --report ".replay-lab/social-e2e/$fixture-equivalence.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol1b-v1-exact-head-private-acceptance
          path: |
            .replay-lab/social-e2e/*report.json
            .replay-lab/social-e2e/sol1b-source-manifest.json
          if-no-files-found: ignore
          retention-days: 14
