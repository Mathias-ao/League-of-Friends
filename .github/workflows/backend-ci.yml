name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
