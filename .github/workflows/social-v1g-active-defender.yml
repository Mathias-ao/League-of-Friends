name: SOC-V1G Active Defender Original Source Evidence

on:
  pull_request:
    paths:
      - "replay-tools/social_v1g_active_counterplay.py"
      - "replay-tools/tests/test_social_v1g_active_counterplay.py"
      - "replay-tools/tests/probe_social_v1g_original_defender.py"
      - ".github/workflows/social-v1g-active-defender.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-defender-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: replay-tools/requirements.txt
      - run: python -m pip install -r replay-tools/requirements.txt
      - name: Inspect immutable original source / no credit
        run: python replay-tools/tests/probe_social_v1g_original_defender.py
      - name: Narrow source-method and source-negative tests
        env:
          AOF_SOC_V1G_AUTHENTIC: "1"
        run: python -m unittest discover -s replay-tools/tests -p test_social_v1g_active_counterplay.py -v
